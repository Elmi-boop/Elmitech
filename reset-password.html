<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password | E-Ledger</title>
<style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#182033;min-height:100vh;display:grid;place-items:center}
.card{width:min(430px,calc(100% - 32px));background:#fff;border-radius:18px;padding:28px;box-shadow:0 12px 40px #0001}
h1{margin:0 0 8px;font-size:25px}.muted{color:#667085;line-height:1.5}
label{display:block;margin-top:16px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;margin-top:7px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px}
button{width:100%;padding:12px;margin-top:18px;border:0;border-radius:10px;background:#1c28ca;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
a{color:#1c28ca;text-decoration:none;font-weight:600}.msg{margin-top:14px;padding:11px;border-radius:10px;display:none;white-space:pre-wrap}.ok{background:#ecfdf3;color:#067647}.err{background:#fef3f2;color:#b42318}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
<h1>E-Ledger</h1>
<p id="intro" class="muted">Reset your E-Ledger password. Enter your account email and we will send you a secure reset link.</p>

<section id="request">
<label for="email">Email</label>
<input id="email" type="email" value="ahmedelmison@gmail.com" autocomplete="email">
<button id="send">Send reset email</button>
<div id="requestMsg" class="msg"></div>
<p style="margin-top:18px"><a href="e-ledger.html">← Back to E-Ledger login</a></p>
</section>

<section id="change" class="hidden">
<label for="password">New password</label>
<input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
<label for="confirm">Confirm new password</label>
<input id="confirm" type="password" autocomplete="new-password" minlength="8">
<button id="save">Update password</button>
<div id="changeMsg" class="msg"></div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://igvelcvalcmrzhkvdbgd.supabase.co';
const SUPABASE_KEY='sb_publishable_PXbjO-n1sqD1VwLNc54dUA_cubcmSX-';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const request=document.getElementById('request');
const change=document.getElementById('change');
const intro=document.getElementById('intro');

function showMsg(id,text,ok){const el=document.getElementById(id);el.textContent=text;el.className='msg '+(ok?'ok':'err');el.style.display='block';}

async function sendReset(){
 const email=document.getElementById('email').value.trim();
 if(!email){showMsg('requestMsg','Enter your email address.',false);return;}
 document.getElementById('send').disabled=true;
 showMsg('requestMsg','Sending secure reset email…',true);
 const redirectTo=location.origin+location.pathname;
 const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo});
 if(error) showMsg('requestMsg','Could not send reset email.\n'+error.message,false);
 else showMsg('requestMsg','If the account exists, a reset email has been sent. Check your inbox and spam folder, then open the link in that email.',true);
 document.getElementById('send').disabled=false;
}

async function savePassword(){
 const p=document.getElementById('password').value;
 const c=document.getElementById('confirm').value;
 if(p.length<8){showMsg('changeMsg','Use at least 8 characters.',false);return;}
 if(p!==c){showMsg('changeMsg','The passwords do not match.',false);return;}
 document.getElementById('save').disabled=true;
 const {error}=await supabase.auth.updateUser({password:p});
 if(error){showMsg('changeMsg','Password update failed.\n'+error.message,false);document.getElementById('save').disabled=false;return;}
 showMsg('changeMsg','Password updated successfully. You can now sign in to E-Ledger with your new password.',true);
 setTimeout(()=>location.href='e-ledger.html',1800);
}

document.getElementById('send').onclick=sendReset;
document.getElementById('save').onclick=savePassword;

supabase.auth.onAuthStateChange((event,session)=>{
 if(event==='PASSWORD_RECOVERY' || session && location.hash.includes('access_token')){
   request.classList.add('hidden');change.classList.remove('hidden');
   intro.textContent='Choose a new password for your E-Ledger account.';
 }
});
</script>
</body>
</html>
