<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Ledger Connection Test</title><style>body{font-family:Segoe UI,Arial;background:#f5f7fb;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:#fff;padding:28px;border-radius:16px;box-shadow:0 10px 40px #0001;width:min(480px,90%)}input,button{width:100%;padding:12px;margin-top:8px;box-sizing:border-box;border-radius:9px;border:1px solid #ddd}button{background:#1c28ca;color:white;border:0;font-weight:700}.ok{color:#087443}.err{color:#b42318}.muted{color:#667085}</style></head><body><div class="card"><h2>E-Ledger Connection Test</h2><p class="muted">This test does not send your password to ChatGPT. It tests the connection directly from your browser.</p><label>Email</label><input id="e" type="email" value="ahmedelmison@gmail.com"><label>Password</label><input id="p" type="password"><button id="b">Test Sign-in</button><pre id="o" style="white-space:pre-wrap"></pre></div><script>const URL='https://igvelcvalcmrzhkvdbgd.supabase.co';const KEY='sb_publishable_PXbjO-n1sqD1VwLNc54dUA_cubcmSX-';b.onclick=async()=>{o.className='muted';o.textContent='Testing Supabase Auth…';try{const c=new AbortController();const t=setTimeout(()=>c.abort(),15000);const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:e.value,password:p.value}),signal:c.signal});clearTimeout(t);const txt=await r.text();if(!r.ok){o.className='err';o.textContent='Auth responded: HTTP '+r.status+'\\n'+txt;return}const d=JSON.parse(txt);o.className='ok';o.textContent='SUCCESS — Supabase authentication works.\\nUser: '+(d.user?.email||e.value)+'\\nThe remaining issue is inside the E-Ledger app initialization.'}catch(x){o.className='err';o.textContent='CONNECTION FAILED\\n'+x.message}}</script></body></html>
