<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Ledger</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff;display:grid;place-items:center;height:100vh}.box{text-align:center}.spin{width:34px;height:34px;border:4px solid #334155;border-top-color:#60a5fa;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}@keyframes s{to{transform:rotate(360deg)}}#e{color:#fca5a5;max-width:560px}</style></head>
<body><div class="box"><div class="spin"></div><div>Loading E-Ledger…</div><div id="e"></div></div>
<script>
(async()=>{try{
const r=await fetch('https://igvelcvalcmrzhkvdbgd.supabase.co/functions/v1/e-ledger-app',{cache:'no-store'});
if(!r.ok) throw new Error('Backend returned HTTP '+r.status);
const h=await r.text();
document.open();document.write(h);document.close();
}catch(e){document.querySelector('#e').textContent='E-Ledger could not load: '+e.message;}})();
</script></body></html>
