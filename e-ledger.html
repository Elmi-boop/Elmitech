<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Ledger | Elmi-29</title>
<style>body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#182033;display:grid;place-items:center;height:100vh}.box{text-align:center}.spin{width:34px;height:34px;border:4px solid #d9deea;border-top-color:#1c28ca;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}@keyframes s{to{transform:rotate(360deg)}}#e{color:#b42318;max-width:700px}</style></head>
<body><div class="box"><div class="spin"></div><h2>E-Ledger | Elmi-29</h2><div>Connecting to the cloud system…</div><div id="e"></div><p><a href="reset-password.html">Forgot password?</a></p></div>
<script>
(async()=>{try{
const u='https://igvelcvalcmrzhkvdbgd.supabase.co/functions/v1/e-ledger-app?v=4&x='+Date.now();
const r=await fetch(u,{cache:'no-store'});
if(!r.ok) throw new Error('Backend returned HTTP '+r.status);
const h=await r.text();
if(!h.includes('E-Ledger')) throw new Error('Unexpected backend page received');
document.open();document.write(h);document.close();
}catch(e){document.querySelector('#e').textContent='E-Ledger could not load: '+e.message;}})();
</script></body></html>
