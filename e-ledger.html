async function q(table,opts={}){let x=sb.from(table).select(opts.select||'*'); if(opts.eq) for(const [k,v] of Object.entries(opts.eq)) x=x.eq(k,v); if(opts.order)x=x.order(opts.order,{ascending:opts.asc??false}); if(opts.limit)x=x.limit(opts.limit); const {data,error}=await x;if(error)throw error;return data||[]}

 try{

 }catch(err){

async function inventory(){
 const stock=await q('current_stock',{order:'quantity',asc:false}); document.getElementById('content').innerHTML='<div class="card"><h3>Current Inventory</h3><div class="tablewrap"><table class="table"><thead><tr><th>Product</th><th>Location</th><th>Qty</th><th>Store Price</th><th>Value</th></tr></thead><tbody>'+stock.map(r=>'<tr><td>'+esc(r.product_name||r.name)+'</td><td>'+esc(r.location_name||r.location)+'</td><td>'+r.quantity+'</td><td>'+money(r.standard_price||0)+'</td><td>'+money(Number(r.quantity||0)*Number(r.standard_price||0))+'</td></tr>').join('')+'</tbody></table></div></div>';
}
function productOptions(){return products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' — '+money(p.standard_price)+'</option>').join('')}

async function sales(){
 document.getElementById('content').innerHTML='<div class="card"><h3>New Customer Sale</h3><div class="notice">A sale changes stock. Payment is recorded separately. Shop sales are proceeds due to Macalim; Store sales are received by Elmi-29.</div><div class="formgrid"><div><label>From location</label><select id="saleFrom">'+locations.filter(l=>['STORE','WAAFI','HIPOWER'].includes(l.code)).map(l=>'<option value="'+l.id+'">'+l.name+'</option>').join('')+'</select></div><div><label>Product</label><select id="saleProduct">'+productOptions()+'</select></div><div><label>Quantity</label><input id="saleQty" type="number" min="1" value="1"></div><div><label>Unit price</label><input id="salePrice" type="number" min="0"></div><div><label>Date</label><input id="saleDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div><label>Notes (auto-filled if blank)</label><input id="saleNotes" placeholder="Optional invoice or sale note"></div></div><div class="actions"><button onclick="saveSale()">Save Sale</button></div><p id="saleMsg"></p></div>';
 document.getElementById('saleProduct').onchange=()=>setSalePrice();document.getElementById('saleFrom').onchange=()=>setSalePrice();setSalePrice();
}

async function saveSale(){try{const p=products.find(x=>x.id===saleProduct.value),f=locations.find(x=>x.id===saleFrom.value),qty=Number(saleQty.value),price=Number(salePrice.value);if(!p||!f||qty<1)throw Error('Complete the sale fields.');if(!confirm(f.name+' → Customer\n'+p.name+'\nQty: '+qty+'\nPrice: '+money(price)+'\nTotal: '+money(qty*price)+'\n\nConfirm save?'))return;const {error}=await sb.from('ledger_transactions').insert({transaction_type:'sale',transaction_date:saleDate.value,from_location:f.id,to_location:locations.find(x=>x.code==='CUSTOMER').id,product_id:p.id,quantity:qty,unit_price:price,total_amount:qty*price,notes:saleNotes.value||null,status:'active'});if(error)throw error;saleMsg.className='ok';saleMsg.textContent='Sale saved successfully.';products=await q('products',{eq:{active:true},order:'name',asc:true})}catch(e){saleMsg.className='error';saleMsg.textContent=e.message}}

async function moneyPage(){const [r,cats]=await Promise.all([q('money_flow_report',{order:'transaction_date',asc:false,limit:200}),q('expense_categories',{order:'code',asc:true})]);const opts=accounts.map(a=>'<option value="'+a.id+'">'+esc(a.code+' — '+a.name)+'</option>').join('');const shops=accounts.filter(a=>['WAAFI','HIPOWER'].includes(a.code)).map(a=>'<option value="'+a.id+'">'+a.code+'</option>').join('');const catsHtml=cats.map(x=>'<option value="'+x.id+'">'+esc(x.code+' — '+x.name)+'</option>').join('');document.getElementById('content').innerHTML='<div class="grid"><div class="card"><h3>🏪 Shop sales → Macalim</h3><p class="notice">Shop sales are credited to Macalim automatically from the sales ledger. Do not enter a second payment for the same sale; the Banks balance already includes it.</p><p class="muted">Use this form only for a separate, documented cash settlement that is not already represented by a sale.</p><div class="formgrid"><div><label>Shop</label><select id="mpShop">'+shops+'</select></div><div><label>Amount</label><input id="mpAmount" type="number" min="0.01" step="0.01"></div><div><label>Date</label><input id="mpDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div><label>Reference</label><input id="mpRef" placeholder="M-Pesa / cash reference"></div><div><label>Notes</label><input id="mpNotes"></div></div><div class="actions"><button onclick="saveShopPayment()">Save payment</button></div></div><div class="card"><h3>🏦 Macalim → Elmi-29</h3><p class="muted">Manual transfer only. Never created automatically by a shop sale.</p><div class="formgrid"><div><label>Amount</label><input id="btAmount" type="number" min="0.01" step="0.01"></div><div><label>Date</label><input id="btDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div><label>Reference</label><input id="btRef"></div><div><label>Notes</label><input id="btNotes"></div></div><div class="actions"><button onclick="saveBankTransfer()">Save transfer h><th>Type</th><th>From</th><th>To</th><th>Amount</th><th>Reference</th></tr></thead><tbody>'+r.map(x=>'<tr><td>'+x.transaction_date+'</td><td>'+esc(x.transaction_type)+'</td><td>'+esc(x.from_account_code||'')+'</td><td>'+esc(x.to_account_code||'')+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.reference||'')+'</td></tr>').join('')+'</tbody></table></div></div>'}

async function qAll(table,order=null,asc=false){
 const rows=[];let offset=0;
 while(true){
  let query=sb.from(table).select('*');
  if(order){query=query.order(order,{ascending:asc});if(order==='transaction_date'&&(table==='macalim_statement_report'||table==='elmi29_statement_report'))query=query.order('transaction_no',{ascending:asc}).order('entry_id',{ascending:asc});}
  const {data,error}=await query.range(offset,offset+499);
  if(error)throw error;
  const batch=data||[];rows.push(...batch);
  if(batch.length<500)break;
  offset+=500;
 }
 return rows;
}

async function aiPage(){document.getElementById('content').innerHTML='<div class="card"><h3>🤖 AI / Smart Entry</h3><p class="muted">Write any transaction in English or Somali. AI matches laptop names from your real stock list and creates a review draft. Nothing is saved until you confirm.</p><textarea id="aiText" rows="5" placeholder="1030 G4 i7 2pc\nWaafi sold 2 HP 840 G3 i5, each 21000\nStore sent 5 HP 840 G6 i7 to Waafi\nMacalim sent 50000 to Elmi-29"></textarea><div class="actions"><button onclick="parseAI()">Create review</button></div><div id="aiReview" class="panel"></div></div>'}
function aiNorm(s){return String(s||'').toLowerCase().replace(/hp\s*/g,'').replace(/(\d+)\s*gb\b/g,'$1').replace(/[\u2044/_,;:()\-\u2013]/g,' ').replace(/\b(ssd|ram|gb|giga|pcs?|pieces?|piece|pc)\b/g,' ').replace(/\s+/g,' ').trim()}
function aiTokens(s){return aiNorm(s).split(/\s+/).filter(Boolean)}
function aiFindProduct(raw){const input=aiTokens(raw), scored=products.map(p=>{const pt=aiTokens(p.name),hits=pt.filter(t=>input.includes(t)).length;const model=pt.filter(t=>/^\d{3,4}$/.test(t)||/^g\d+$/.test(t)||/^\d{2}e$/.test(t)||/^i[3579]$/.test(t)).filter(t=>input.includes(t)).length;return {p,hits,model,score:model*10+hits}}).filter(x=>x.model>0).sort((a,b)=>b.score-a.score||b.hits-a.hits);return scored[0]?.p||null}
function aiFindProducts(raw){return String(raw).split(/\r?\n/).map(line=>{const p=aiFindProduct(line);return p?{product_id:p.id,product_name:p.name,quantity:aiQuantity(line),unit_price:aiAmount(line)||Number(p.standard_price||0)}:null}).filter(Boolean)}
function aiQuantity(raw){return aiNum(raw,/\b(\d+)\s*(?:pc|pcs|piece|pieces|units?|x)\b/i)||aiNum(raw,/\b(?:qty|quantity)\s*[:=]?\s*(\d+)\b/i)||aiNum(raw,/\b(?:sold|sell|sent|send|received|receive|arrived|bought|buy|iib|iibiyay|wareejiyay)\s+(\d+)\b/i)||1}
function aiNum(raw,pattern){const m=String(raw).match(pattern);return m?Number(m[1]):null}
function aiAmount(raw){const ms=[...String(raw).matchAll(/(?:ksh|kes|amount|each|price|qiimo)?\s*[:=]?\s*(\d[\d,]*(?:\.\d+)?)/gi)].map(m=>Number(m[1].replace(/,/g,''))).filter(n=>n>=5000);return ms.length?ms[ms.length-1]:0}
function aiLocation(raw){const low=String(raw).toLowerCase();return locations.find(l=>low.includes(String(l.code||'').toLowerCase())||low.includes(String(l.name||'').toLowerCase()))||null}
function aiLocations(raw){const low=String(raw).toLowerCase();return locations.filter(l=>low.includes(String(l.code||'').toLowerCase())||low.includes(String(l.name||'').toLowerCase())).sort((a,b)=>Math.min(...[a.code,a.name].map(x=>{const n=low.indexOf(String(x||'').toLowerCase());return n<0?99999:n}))-Math.min(...[b.code,b.name].map(x=>{const n=low.indexOf(String(x||'').toLowerCase());return n<0?99999:n})))}
function aiAccount(raw){const low=String(raw).toLowerCase();return accounts.find(a=>low.includes(String(a.code||'').toLowerCase())||low.includes(String(a.name||'').toLowerCase()))||null}
function aiDate(raw){const m=String(raw).match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/);if(!m)return new Date().toISOString().slice(0,10);let y=Number(m[3]);if(y<100)y+=2000;return y+'-'+String(Number(m[2])).padStart(2,'0')+'-'+String(Number(m[1])).padStart(2,'0')}
function aiType(raw){const low=String(raw).toLowerCase();if(/expense|cost|kharash|bixid/.test(low))return 'expense';if(/macalim.{0,20}(sent|send|transfer|gave).{0,20}(elmi|elmi-29)|bank transfer|wareej.*lacag/.test(low))return 'bank_transfer';if(/account transfer|move money|transfer money|lacag.*wareej/.test(low))return 'account_transfer';if(/receipt|payment received|received money|cash received|lacag.*hel/.test(low))return 'store_sale_receipt';if(/shop payment|paid.*shop|shop.*paid/.test(low))return 'shop_payment';if(/sold|sale|sell|iib|la iib/.test(low))return 'sale';if(/transfer|sent|send|receive|received|arrived|shipment|wareej|diray|soo gaar/.test(low))return 'stock_transfer';return 'unknown'}
function aiPayload(raw){const low=String(raw).toLowerCase(),items=aiFindProducts(raw),ls=aiLocations(raw);let type=aiType(raw),fromLoc=ls[0]||null,toLoc=ls[1]||null;if(items.length&&/to\s+(store|waafi|hipower)|from\s+(store|waafi|hipower)/i.test(raw))type='stock_transfer';if(/\bstore\b/i.test(raw)&&/\bwaafi\b/i.test(raw)){fromLoc=locations.find(l=>l.code==='STORE')||fromLoc;toLoc=locations.find(l=>l.code==='WAAFI')||toLoc}if(/\bstore\b/i.test(raw)&&/\bhipower\b/i.test(raw)){fromLoc=locations.find(l=>l.code==='STORE')||fromLoc;toLoc=locations.find(l=>l.code==='HIPOWER')||toLoc}const fromAcc=aiAccount(raw),toAcc=accounts.find(a=>/elmi/.test(low)&&a.code==='ELMI-29')||null;const first=items[0]||{};const p={type,raw,transaction_date:aiDate(raw),items,product_id:first.product_id||null,product_name:first.product_name||null,quantity:first.quantity||0,unit_price:first.unit_price||0,amount:aiAmount(raw),from_location_id:fromLoc?.id||null,from_location_name:fromLoc?.name||null,to_location_id:toLoc?.id||null,to_location_name:toLoc?.name||null,from_account_id:fromAcc?.id||null,from_account_code:fromAcc?.code||null,to_account_id:toAcc?.id||null,to_account_code:toAcc?.code||null};if(type==='bank_transfer'){p.from_account_id=accounts.find(a=>a.code==='MACALIM')?.id||null;p.from_account_code='MACALIM';p.to_account_id=accounts.find(a=>a.code==='ELMI-29')?.id||null;p.to_account_code='ELMI-29'}return p}
function aiMissing(p){const m=[],items=p.items?.length?p.items:(p.product_id?[p]:[]);if(p.type==='unknown')m.push('transaction type (sale, transfer, receipt, expense, or bank transfer)');if(['sale','stock_transfer'].includes(p.type)&&!items.length)m.push('at least one exact laptop model');if(['sale','stock_transfer'].includes(p.type)&&items.some(x=>!x.quantity||x.quantity<1))m.push('quantity for every item');if(p.type==='sale'&&!p.from_location_id)m.push('selling location');if(p.type==='stock_transfer'&&(!p.from_location_id||!p.to_location_id))m.push('from and to locations');if(['bank_transfer','account_transfer','expense','store_sale_receipt','shop_payment'].includes(p.type)&&(!p.amount||p.amount<=0))m.push('amount');if(p.type==='account_transfer'&&(!p.from_account_id||!p.to_account_id))m.push('source and destination accounts');if(p.type==='expense'&&!p.from_account_id)m.push('payment account');return m}
function aiAccountingLabel(p){
 const from=String(p.from_location_name||'').toUpperCase(),to=String(p.to_location_name||'').toUpperCase(),type=String(p.type||'').toLowerCase();
 const has=(value,word)=>value.includes(word);
 if(type==='sale')return 'Cash sale';
 if(type==='stock_adjustment')return 'Stock adjustment';
 if(has(from,'DUBAI')&&has(to,'STORE'))return 'Merchandise';
 if(has(from,'STORE')&&(has(to,'WAAFI')||has(to,'HIPOWER')))return 'Invoice';
 if((has(from,'WAAFI')||has(from,'HIPOWER'))&&(has(to,'WAAFI')||has(to,'HIPOWER')))return 'Credit';
 if((has(from,'WAAFI')||has(from,'HIPOWER'))&&has(to,'STORE'))return 'Credit return';
 return 'Stock movement';
}
async function parseAI(){
 const input=document.getElementById('aiText'),review=document.getElementById('aiReview');
 try{
  const raw=String(input?.value||'').trim();
  if(!raw){review.innerHTML='<p class="error">Write a transaction first.</p>';return}
  const payload=aiPayload(raw),accounting=aiAccountingLabel(payload),valueLabel=accounting==='Invoice'?'TOTAL INVOICE':accounting==='Credit'?'CREDIT VALUE':'TOTAL STOCK VALUE';
  const missing=aiMissing(payload);window._aiPendingPayload=payload;
  const items=payload.items||[],grandTotal=items.reduce((sum,x)=>sum+Number(x.quantity||0)*Number(x.unit_price||0),0),itemRows=items.map(x=>'<tr><td>'+esc(x.product_name)+'</td><td>'+esc(x.quantity)+'</td><td>'+money(x.unit_price)+'</td><td>'+money(Number(x.quantity||0)*Number(x.unit_price||0))+'</td></tr>').join('');
  const status=missing.length?'<p class="notice">Needs correction before saving: '+esc(missing.join(', '))+'</p>':'<p class="notice">Review every line. Nothing is saved until you confirm.</p>';
  const explanation=accounting==='Invoice'?'<br><span class="muted">Shop payment remains outstanding; no money transaction is created.</span>':accounting==='Credit'?'<br><span class="muted">Internal shop credit; no money transaction is created.</span>':accounting==='Merchandise'?'<br><span class="muted">Merchandise receipt into Store.</span>':'';
  review.innerHTML='<div class="card"><h4>Review before saving</h4><table class="table"><thead><tr><th>Correct product</th><th>Qty</th><th>Unit price</th><th>Line total</th></tr></thead><tbody>'+itemRows+'</tbody><tfoot><tr><th colspan="3">'+valueLabel+'</th><th>'+money(grandTotal)+'</th></tr></tfoot></table><p><strong>Movement:</strong> '+esc(payload.type==='stock_transfer'?'Stock transfer':payload.type)+'<br><strong>Accounting:</strong> '+esc(accounting)+explanation+'<br><strong>From:</strong> '+esc(payload.from_location_name||payload.from_account_code||'—')+'<br><strong>To:</strong> '+esc(payload.to_location_name||payload.to_account_code||'—')+'<br><strong>Date:</strong> '+esc(payload.transaction_date)+'</p>'+status+'<button onclick="confirmAI()">Confirm and save</button> <button class="danger" onclick="cancelAI()">Cancel</button></div>';
 }catch(error){review.innerHTML='<p class="error">AI could not create the review: '+esc(error?.message||String(error))+'</p>';console.error('AI review failed',error)}
}
async function confirmAI(id=null){const p=id?((await sb.from('ai_entry_drafts').select('*').eq('id',id).single()).data||{}).parsed_payload:window._aiPendingPayload;if(!p){alert('Create the review first.');return}const missing=aiMissing(p);if(missing.length){alert('Correct the draft first: '+missing.join(', '));return}let error=null;if(p.type==='sale'||p.type==='stock_transfer'){const items=p.items?.length?p.items:[p],customer=(locations.find(l=>l.code==='CUSTOMER')||{}).id;for(const item of items){const standard=products.find(x=>x.id===item.product_id)?.standard_price||0;const invoiceTransfer=p.type==='stock_transfer'&&locations.find(l=>l.id===p.from_location_id)?.code==='STORE'&&['WAAFI','HIPOWER'].includes(locations.find(l=>l.id===p.to_location_id)?.code);const row={transaction_type:p.type,transaction_date:p.transaction_date,from_location:p.from_location_id,to_location:p.type==='sale'?customer:p.to_location_id,product_id:item.product_id,quantity:item.quantity,unit_price:p.type==='sale'?(item.unit_price||standard):standard,total_amount:item.quantity*(p.type==='sale'?(item.unit_price||standard):standard),invoice_amount:invoiceTransfer?item.quantity*standard:null,invoice_notes:invoiceTransfer?'Store invoice — shop payment outstanding':null,status:'active',notes:'Confirmed from AI/Smart Entry'};const result=await sb.from('ledger_transactions').insert(row);if(result.error){error=result.error;break}}}else{let from=p.from_account_id,to=p.to_account_id;if(p.type==='bank_transfer'){from=accounts.find(a=>a.code==='MACALIM')?.id;to=accounts.find(a=>a.code==='ELMI-29')?.id}if(p.type==='store_sale_receipt'){from=accounts.find(a=>a.code==='CUSTOMER')?.id;to=accounts.find(a=>a.code==='ELMI-29')?.id}const row={transaction_type:p.type,transaction_date:p.transaction_date,from_account:from||null,to_account:to||null,amount:p.amount,reference:null,notes:'Confirmed from AI/Smart Entry',status:'active',device_name:'E-Ledger AI'};({error}=await sb.from('money_transactions').insert(row))}if(error){alert(error.message);return}window._aiPendingPayload=null;alert('Confirmed and saved.');aiPage()}

  out.innerHTML='<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>No.</th><th>Source</th><th>Location</th><th>Category</th><th>Movement</th><th>Item</th><th>Qty</th><th>Stock / money flow</th><th>Amount</th><th>Status</th><th>Notes</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr class="'+(r.status==='void'?'muted':'')+'" style="cursor:pointer" title="Click to view full record" onclick="openHistoryRecord('+i+')"><td>'+esc(r.date)+'</td><td>'+esc(r.no)+'</td><td>'+esc(r.source)+'</td><td>'+esc(r.locations.length?r.locations.join(' / '):'—')+'</td><td><strong>'+esc(r.category)+'</strong></td><td>'+esc(r.movement)+'</td><td>'+esc(r.item)+'</td><td>'+esc(r.quantity)+'</td><td>'+esc(r.flow)+'</td><td>'+esc(r.amount)+'</td><td>'+esc(r.status==='void'?'Void':'Active')+'</td><td>'+esc(r.notes)+'</td></tr>').join('')+'</tbody></table></div>';
 }catch(e){msg.className='error';msg.textContent='History could not load: '+(e?.message||e)}
}

ach row shows the total after that transaction.</p><div class="actions no-print"><button class="secondary" onclick="printBankStatement(\'elmiStatement\')">Print Elmi-29 A4 / Save PDF</button><button class="secondary" onclick="viewBankStatementInExcel(\'elmiStatement\')">View Elmi-29 in Excel</button><button class="secondary" onclick="exportBankStatementExcel(\'elmiStatement\',\'elmi29-statement.xls\')">Export Elmi-29 to Excel</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>From</th><th>To</th><th>Credit</th><th>Debit</th><th>Total after transaction</th><th>Reference</th></tr></thead><tbody>'+bankStatementTable(elStatement)+'</tbody></table></div></div><div class="card panel"><h3>Macalim Due by Shop</h3><div class="tablewrap"><table class="table"><thead><tr><th>Shop</th><th>Sales</th><th>Credited to Macalim</th><th>Outstanding</th></tr></thead><tbody>'+d.map(x=>'<tr><td>'+esc(x.shop_name)+'</td><td>'+money(x.sales_due_to_macalim)+'</td><td>'+money(x.paid_to_macalim)+'</td><td><strong>'+money(x.outstanding_to_macalim)+'</strong></td></tr>').join('')+'</tbody></table></div></div>';

function toggleBankStatement(id){const el=document.getElementById(id);if(el)el.classList.toggle('hidden')}
function printBankStatement(id){
 const target=document.getElementById(id);
 if(!target){alert('Open this account report first.');return}
 const title=id==='macalimStatement'?'Macalim full statement':id==='elmiStatement'?'Elmi-29 full statement':'Bank statement';
 ensureReportBranding(target,title);
 target.classList.remove('hidden');
 target.classList.add('print-bank-target');
 document.body.classList.add('print-bank-statement');
 const cleanup=()=>{target.classList.remove('print-bank-target');document.body.classList.remove('print-bank-statement')};
 window.addEventListener('afterprint',cleanup,{once:true});
 window.print();
 setTimeout(cleanup,3000);
}
